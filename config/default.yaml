app_name: LivingAgent
environment: development
database_url: sqlite+aiosqlite:///./living_agent.db
owner_id: owner-local
admin_ids: []
log_level: INFO
model_provider: mock
audit_page_size: 100
test_disable_delays: false
plugin_root: plugins/examples
enabled_plugins:
  - com.livingagent.calculator
plugin_timeout_seconds: 2.0
persona_root: personas/default
prompt_root: prompts
root_prompt_second_factor_sha256: null
psyche_decay_half_life_hours: 12.0
napcat_enabled: false
napcat_access_token: null
napcat_action_timeout_seconds: 5.0
napcat_max_message_chars: 12000
napcat_max_frame_bytes: 1048576
napcat_max_in_flight_events: 16
