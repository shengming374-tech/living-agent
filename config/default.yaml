app_name: LivingAgent
environment: development
database_url: sqlite+aiosqlite:///./living_agent.db
owner_id: owner-local
admin_ids: []
log_level: INFO
model_provider: mock
model_name: mock-chat-v1
model_api_base_url: null
model_api_key: null
model_timeout_seconds: 60.0
model_max_output_tokens: 1024
model_temperature: 0.7
model_max_context_chars: 100000
model_max_response_bytes: 1048576
model_allow_insecure_http: false
embedding_provider: mock
embedding_model: mock-hash-v1
embedding_api_base_url: null
embedding_api_key: null
embedding_dimensions: null
embedding_timeout_seconds: 15.0
embedding_max_batch_size: 32
embedding_max_input_chars: 12000
embedding_max_total_chars: 48000
embedding_max_response_bytes: 4194304
embedding_allow_insecure_http: false
audit_page_size: 100
test_disable_delays: false
plugin_root: plugins/examples
enabled_plugins:
  - com.livingagent.calculator
plugin_timeout_seconds: 2.0
persona_root: personas/default
prompt_root: prompts
root_prompt_second_factor_sha256: null
psyche_decay_half_life_hours: 12.0
napcat_enabled: false
napcat_access_token: null
napcat_action_timeout_seconds: 5.0
napcat_max_message_chars: 12000
napcat_max_frame_bytes: 1048576
napcat_max_in_flight_events: 16
openclaw_bridge_enabled: false
openclaw_bridge_access_token: null
openclaw_bridge_allowed_channels:
  - openclaw-weixin
openclaw_bridge_allowed_account_ids: []
openclaw_bridge_max_message_chars: 12000
openclaw_bridge_idempotency_entries: 2048
